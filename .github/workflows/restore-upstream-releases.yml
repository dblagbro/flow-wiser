name: Restore upstream release history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-upstream-releases.yml

permissions:
  contents: write

concurrency:
  group: restore-upstream-release-history
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore Flowise release pages
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPOSITORY: FlowiseAI/Flowise
          START_DATE: "2024-08-04T00:00:00Z"
          END_DATE: "2026-08-04T23:59:59Z"
          EXPECTED_RELEASE_COUNT: "41"
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          from urllib import error, parse, request

          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_REPOSITORY"]
          upstream = os.environ["UPSTREAM_REPOSITORY"]
          start = os.environ["START_DATE"]
          end = os.environ["END_DATE"]
          expected = int(os.environ["EXPECTED_RELEASE_COUNT"])
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "flowise-release-history-restorer",
          }

          def api(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload).encode()
              req = request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(
                      f"{method} {path} failed: {exc.code} {detail}"
                  ) from exc

          releases = []
          page = 1
          while True:
              batch = api(
                  "GET",
                  f"/repos/{upstream}/releases?per_page=100&page={page}",
              )
              if not batch:
                  break
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          selected = sorted(
              (
                  item
                  for item in releases
                  if not item.get("draft")
                  and item.get("tag_name", "").startswith("flowise@")
                  and item.get("published_at")
                  and start <= item["published_at"] <= end
              ),
              key=lambda item: item["published_at"],
          )
          if len(selected) != expected:
              raise RuntimeError(
                  f"Expected {expected} releases, found {len(selected)}"
              )

          def resolve_commit(repo, tag):
              encoded = parse.quote(tag, safe="")
              ref = api("GET", f"/repos/{repo}/git/ref/tags/{encoded}")
              obj = ref["object"]
              while obj["type"] == "tag":
                  obj = api(
                      "GET", f"/repos/{repo}/git/tags/{obj['sha']}"
                  )["object"]
              if obj["type"] != "commit":
                  raise RuntimeError(
                      f"{repo}:{tag} resolves to {obj['type']}, not a commit"
                  )
              return obj["sha"]

          created_tags = []
          created_releases = []
          skipped = []

          for item in selected:
              tag = item["tag_name"]
              encoded = parse.quote(tag, safe="")
              upstream_sha = resolve_commit(upstream, tag)
              target_ref = api(
                  "GET",
                  f"/repos/{target}/git/ref/tags/{encoded}",
                  allow_404=True,
              )
              if target_ref is None:
                  api(
                      "POST",
                      f"/repos/{target}/git/refs",
                      {"ref": f"refs/tags/{tag}", "sha": upstream_sha},
                  )
                  created_tags.append(tag)
              else:
                  target_sha = resolve_commit(target, tag)
                  if target_sha != upstream_sha:
                      raise RuntimeError(
                          f"Tag mismatch for {tag}: target {target_sha}, "
                          f"upstream {upstream_sha}"
                      )

              existing = api(
                  "GET",
                  f"/repos/{target}/releases/tags/{encoded}",
                  allow_404=True,
              )
              if existing is not None:
                  skipped.append(tag)
                  continue

              provenance = (
                  f"> Historical release imported from "
                  f"[{upstream}]({item['html_url']}).  \n"
                  f"> Original upstream publication date: "
                  f"`{item['published_at']}`.  \n"
                  "> GitHub shows the import date as this fork's publication date.\n\n"
              )
              # The tag already exists and has been SHA-verified above. Do not pass
              # target_commitish here: GitHub requires workflow-write permission
              # when historical commits differ under .github/workflows, and the
              # Actions GITHUB_TOKEN cannot receive that permission.
              api(
                  "POST",
                  f"/repos/{target}/releases",
                  {
                      "tag_name": tag,
                      "name": item.get("name") or tag,
                      "body": provenance + (item.get("body") or ""),
                      "draft": False,
                      "prerelease": bool(item.get("prerelease")),
                      "generate_release_notes": False,
                  },
              )
              created_releases.append(tag)

          lines = [
              "# Upstream release history restoration",
              "",
              f"- Releases discovered: **{len(selected)}**",
              f"- Tags created: **{len(created_tags)}**",
              f"- Release pages created: **{len(created_releases)}**",
              f"- Existing release pages skipped: **{len(skipped)}**",
              "",
          ]
          lines.extend(
              f"- `{item['tag_name']}` - {item['published_at']}"
              for item in selected
          )
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          print(summary)
          PY
